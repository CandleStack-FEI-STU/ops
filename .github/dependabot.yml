# Weekly update pull requests. Minor and patch updates of an ecosystem come together in one
# pull request; each major update comes alone. A release waits 7 days first, so a compromised
# one is likely pulled before it reaches us.
version: 2
updates:
  # The dev dependencies in package.json, pinned to exact versions.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @cloudflare/vitest-plugin peers on vitest ^4; drop this once it supports vitest 5.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]

  # The actions the workflows use, pinned to commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
