name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  # No AI attribution in commits or the pull request. A required check of its own, which
  # `check` does not wait for: editing the pull request's title or description re-runs only
  # this job (no-ai-signs-edited.yml), so `check` must already have run.
  no-ai-signs:
    uses: CandleStack-FEI-STU/.github/.github/workflows/no-ai-signs.yml@main

  # The description closes an issue ("Closes #N"). Required and independent like no-ai-signs:
  # editing the description re-runs only this job (linked-issue-edited.yml).
  linked-issue:
    uses: CandleStack-FEI-STU/.github/.github/workflows/linked-issue.yml@main

  # The title and branch follow the conventions; a warning when the pull request is large.
  # Required and independent like no-ai-signs: editing the title re-runs only this job
  # (pr-hygiene-edited.yml).
  pr-hygiene:
    uses: CandleStack-FEI-STU/.github/.github/workflows/pr-hygiene.yml@main
    permissions:
      pull-requests: read

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      # Bundles the Worker exactly like a deploy, without uploading it.
      - run: npx wrangler deploy --dry-run --outdir dist
