name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Always the first job: no AI attribution in commits or the pull request.
  no-ai-signs:
    uses: CandleStack-FEI-STU/.github/.github/workflows/no-ai-signs.yml@main

  check:
    needs: no-ai-signs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Bundles the Worker exactly like a deploy, without uploading it.
      - run: npx wrangler deploy --dry-run --outdir dist
