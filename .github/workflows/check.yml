name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  # No AI attribution in commits or the pull request. A required check of its own, which
  # `check` does not wait for: editing the pull request's title or description re-runs only
  # this job (no-ai-signs-edited.yml), so `check` must already have run.
  no-ai-signs:
    uses: CandleStack-FEI-STU/.github/.github/workflows/no-ai-signs.yml@main

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Bundles the Worker exactly like a deploy, without uploading it.
      - run: npx wrangler deploy --dry-run --outdir dist
